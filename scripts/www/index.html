
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>FGO 连连看挑战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0c0f1d;
            overflow: hidden;
            margin: 0;
        }

        .fgo-title {
            font-family: 'Cinzel', serif;
        }

        .card-inner {
            transition: transform 0.2s;
        }

        .card-inner:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .match-animate {
            animation: explode 0.3s forwards;
        }

        .bg-chaldea {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed;
        }

        .gold-border {
            border: 2px solid #b4975a;
            box-shadow: 0 0 10px rgba(180, 151, 90, 0.3);
        }
    </style>
